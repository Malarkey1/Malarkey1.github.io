<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience &amp; Projects | Daniel Rutman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body data-page="experience">
<main class="sub">
  <h1 class="page-title">Experience &amp; Projects</h1>

  <!-- Three sections, one below the other. Every card in the grids is built from script.js: the EXPERIENCE list fills "Work Experience", the
       PROJECTS list fills "Projects" and the PERSONAL list fills "Side Quests" (link cards that open in a new tab; rename the heading here). Hover a card (or long press it on a phone) for a preview if it has one, click it for the full viewer.
       To add a job or a project, copy its { ... } block in script.js; nothing to change in this file. -->
  <section class="vsec" aria-labelledby="exp-h">
    <h2 class="vsec-h" id="exp-h"><span>Work Experience</span></h2>
    <div class="vgrid" id="experience" aria-label="Work experience"></div>
  </section>

  <section class="vsec" aria-labelledby="proj-h">
    <h2 class="vsec-h" id="proj-h"><span>Projects</span></h2>
    <div class="vgrid" id="projects" aria-label="Projects"></div>
  </section>

  <section class="vsec" aria-labelledby="pers-h">
    <h2 class="vsec-h" id="pers-h"><span>Side Quests</span></h2>
    <div class="vgrid" id="personal" aria-label="Side quests"></div>
  </section>
</main>
</body>
</html>
